*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--tx);font:15px Tajawal,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px 30px;position:relative;overflow-x:hidden}

.mc .inner{transition:none!important}
.grid,.days,h1,h2,#sh>div,#peek.show,#peek.out{animation:none!important}

.star{will-change:opacity}

function rm(id){if(confirm('حذف هذه المناسبة؟')){S.del.push(id);sv();cl();render()}}
function ef(id){const e=id?all().find(x=>x.id==id):{m:1,d:1,t:'h',ti:'',fg:'',su:'',yr:'',sr:'',df:''};
sheet(`<h3>${id?'تعديل':'إضافة'} مناسبة</h3><div class=f><input id=f1 placeholder="اسم المناسبة" value="${e.ti}"><select id=f2>${HN.map((n,i)=>`<option value=${i+1} ${e.m==i+1?'selected':''}>${n}</option>`).join('')}</select><input id=f3 type=number min=1 max=30 value="${e.d}"><select id=f4>${Object.keys(TY).map(k=>`<option value=${k} ${e.t==k?'selected':''}>${TY[k][0]}</option>`).join('')}</select><input id=f5 placeholder="الشخصية" value="${e.fg||''}"><textarea id=f6 placeholder="شرح مختصر">${e.su||''}</textarea><input id=f7 placeholder="السنة" value="${e.yr||''}"><input id=f8 placeholder="المصدر" value="${srT(e.sr||'')}"><input id=f9 placeholder="اختلاف الروايات" value="${e.df||''}"><button class=pri onclick="sf('${id||''}')">حفظ</button></div>`)}
function sf(id){const o={ti:$('#f1').value,m:+$('#f2').value,d:+$('#f3').value,t:$('#f4').value,fg:$('#f5').value,su:$('#f6').value,yr:$('#f7').value,sr:$('#f8').value,df:$('#f9').value};if(!o.ti)return;if(id)S.ed[id]=o;else S.x.push({id:'c'+Date.now(),...o});sv();cl();render()}
let srDb=null;
function srch(){sheet(`<input id=q style="width:100%" placeholder="اسم شخصية/حدث، أو تاريخ مثل 10/1 أو 25/9" oninput="clearTimeout(srDb);srDb=setTimeout(()=>sr(this.value),120)"><div id=rs></div>`)}
function sr(q){q=q.trim();let r=[];const m=q.match(/^(\d+)[\/\-](\d+)/);
if(m){const a=+m[1],b=+m[2];r=[...new Set([...all().filter(e=>e.gm?e.gd==a&&e.gm==b:e.d==a&&e.m==b),...evs(new Date(V.y,b-1,a))])]}else if(q)r=all().filter(e=>(e.ti+e.fg).includes(q));
$('#rs').innerHTML=r.map(e=>{const d=nmap()[e.id];return`<div class=ev style="border-color:${col(e.t)}" ${d?`onclick="day('${iso(d)}')"`:''}><b>${e.ti}</b><br><small class=mu>${e.gm?e.gd+'/'+e.gm+' ميلادي':e.d+' '+HN[e.m-1]}${d?' · القادمة: '+gf(d):''}</small></div>`}).join('')||'<p class=mu>لا نتائج</p>'}
function upc(){let r='',c=0;for(let i=0;i<400&&c<25;i++){const d=add(T,i);evs(d).forEach(e=>{c++;r+=`<div class=ev onclick="day('${iso(d)}')" style="border-color:${col(e.t)}"><b>${e.ti}</b><br><small class=mu>${gf(d)} · ${hf(hij(d))} · ${i?'بعد '+i+' يوم':'اليوم'}</small></div>`})}sheet('<h3>المناسبات القادمة</h3>'+r)}
let HB;
function hmon(x){HB=x==0?T:add(HB,x>0?30:-1);HB=add(HB,1-hij(HB).d);const m=hij(HB);let r='';
for(let i=0;i<30;i++){const d=add(HB,i),h=hij(d);if(h.m!=m.m)break;evs(d).forEach(e=>r+=`<div class=ev onclick="day('${iso(d)}')" style="border-color:${col(e.t)}"><small class=mu>${h.d} ${HN[m.m-1]} · ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}</small><br><b>${e.ti}</b></div>`)}
sheet(`<h3 style="color:${HCOL[m.m-1]}">${HN[m.m-1]} ${m.y} هـ</h3><div class=bar><button onclick="hmon(-1)">‹ السابق</button><button onclick="hmon(1)">التالي ›</button></div>${r||'<p class=mu>لا مناسبات</p>'}`)}
function jmp(){const th=hij(T);sheet(`<h3>الانتقال إلى يوم</h3><p>ميلادي</p><input type=date id=jd value="${iso(T)}" onchange="goto(new Date(this.value+'T00:00'),1);"><p>هجري</p><div class=bar><input id=jy type=number placeholder="السنة" value="${th.y}" style="width:90px"><select id=jm>${HN.map((n,i)=>`<option value=${i+1} ${th.m==i+1?'selected':''}>${n}</option>`).join('')}</select><input id=jdd type=number placeholder="اليوم" value="${th.d}" style="width:80px"><button class=pri onclick="jh()">اذهب</button></div>`)}
function findHijri(y,m,d){const t=hij(T),g=add(T,Math.round((y-t.y)*354.367+(m-t.m)*29.53+(d-t.d)));for(let k=-6;k<=6;k++){const x=add(g,k),h=hij(x);if(h.y==y&&h.m==m&&h.d==d)return x}return null}
function jh(){const y=+$('#jy').value,m=+$('#jm').value,d=+$('#jdd').value,x=findHijri(y,m,d);if(x){cl();return goto(x,1)}alert('تاريخ غير صالح')}
let SM={d:1,m:1,y:1448};
function sisManual(){const h=hij(T);SM={d:h.d,m:h.m,y:h.y};
sheet(`<h3>🕌 ضبط حسب مكتب السيستاني</h3><p class=mu style="font-size:12.5px">حرّك الأزرار لتاريخ اليوم الهجري كما أعلنه مكتب السيد السيستاني — سيُطبّق فوراً على كل التقويم: كل الأشهر والسنوات والمناسبات.</p>
<div class=stp><span class=mu>اليوم</span><button onclick="smStep('d',-1)">−</button><b id=smDv>${h.d}</b><button onclick="smStep('d',1)">+</button></div>
<div class=stp><span class=mu>الشهر</span><button onclick="smStep('m',-1)">−</button><b id=smMv>${HN[h.m-1]}</b><button onclick="smStep('m',1)">+</button></div>
<div class=stp><span class=mu>السنة</span><button onclick="smStep('y',-1)">−</button><b id=smYv>${h.y}</b><button onclick="smStep('y',1)">+</button></div>
<div id=smPrev class=ev style="border-color:var(--ac);margin-top:12px;text-align:center;transition:transform .15s"></div>
<button class=pri onclick=sisManualSet() style="margin-top:10px;width:100%">✅ ضبط التقويم الآن</button>`);
smPreview()}
function smStep(k,dir){if(k=='d')SM.d=Math.min(30,Math.max(1,SM.d+dir));if(k=='m')SM.m=((SM.m-1+dir+12)%12)+1;if(k=='y')SM.y+=dir;
$('#smDv').textContent=SM.d;$('#smMv').textContent=HN[SM.m-1];$('#smYv').textContent=SM.y;
if(navigator.vibrate)try{navigator.vibrate(5)}catch(e){}
smPreview()}
function smPreview(){const box=$('#smPrev');if(!box)return;let found=null;
for(let off=-6;off<=6;off++){const p={};F.formatToParts(add(T,off)).forEach(x=>p[x.type]=+x.value);if(p.year==SM.y&&p.month==SM.m&&p.day==SM.d){found=off;break}}
box.style.transform='scale(.94)';setTimeout(()=>box.style.transform='scale(1)',90);
if(found!==null){const g=add(T,found);box.innerHTML=`✅ يوافق: <b>${g.toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}</b>`;box.dataset.off=found}
else{box.innerHTML='⚠️ بعيد عن تاريخ اليوم — قرّبه أكثر';delete box.dataset.off}}
function sisManualSet(){const box=$('#smPrev');if(!box||box.dataset.off===undefined){alert('قرّب التاريخ أكثر من تاريخ اليوم الفعلي أولاً');return}
S.off=+box.dataset.off;SIS_TODAY=null;try{localStorage.removeItem(SIS_KEY)}catch(e){}
sv();fx([{t:'e'}]);setTimeout(()=>{cl();render();set()},320)}
function set(){sheet(`<h3>الإعدادات</h3><p>الثيم</p><div class=bar>${[['auto','تلقائي 🌗'],['','كحلي'],['green','أخضر'],['plum','بنفسجي'],['light','فاتح'],['oled','أسود OLED'],['gold','ذهبي تراثي']].map(t=>`<button style="${S.th==t[0]?'outline:2px solid var(--ac)':''}" onclick="S.th='${t[0]}';sv();render();set()">${t[1]}</button>`).join('')}</div><p>ألوان المناسبات</p>${Object.keys(TY).map(k=>`<label>${TY[k][0]} <input type=color value="${col(k)}" onchange="S.c['${k}']=this.value;sv();render()"></label><br>`).join('')}<p>تعديل الهجري (حسب رؤية الهلال)</p><select onchange="S.off=+this.value;sv();render()">${[-3,-2,-1,0,1,2,3].map(o=>`<option value=${o} ${S.off==o?'selected':''}>${o>0?'+'+o:o} يوم</option>`).join('')}</select><div class=bar><button onclick=sisManual()>🕌 ضبط حسب مكتب السيستاني</button></div><p>💡 مجالات "هل تعلم؟" (اتركها فاضية = كل المجالات)</p><div>${Object.keys(FCAT).map(k=>`<label style="display:inline-block;margin:2px 8px 2px 0;font-size:12.5px"><input type=checkbox ${S.factCats.includes(k)?'checked':''} onchange="toggleCat('${k}',this.checked)"> ${FCAT[k]}</label>`).join('')}</div><div class=bar><button class=pri onclick="ef('')">＋ إضافة مناسبة</button></div>`)}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mkStars(){if(RM)return;const box=$('#stars');if(!box||box.dataset.done)return;box.dataset.done=1;
const mk=n=>{let sh=[];for(let i=0;i<n;i++)sh.push(`${(Math.random()*100).toFixed(1)}vw ${(Math.random()*100).toFixed(1)}vh #fff`);return sh.join(',')};
box.innerHTML='<div class=star style="top:0;left:0;width:2px;height:2px;box-shadow:'+mk(35)+';animation-duration:3.4s"></div><div class=star style="top:0;left:0;width:2px;height:2px;box-shadow:'+mk(25)+';animation-duration:2.4s;animation-delay:1.1s"></div>'}
let DAILY_FACT=null,FHIST=[],FIDX=-1;
function pickFact(){const pool=FACTS.filter(f=>!S.factCats.length||S.factCats.includes(f.cat));if(!pool.length)return null;
let avail=pool.filter(f=>!S.seenFacts.includes(f.id));
if(!avail.length){S.seenFacts=[];avail=pool}
const f=avail[Math.floor(Math.random()*avail.length)];
S.seenFacts.push(f.id);sv();return f}
function toggleCat(k,on){if(on){if(!S.factCats.includes(k))S.factCats.push(k)}else S.factCats=S.factCats.filter(x=>x!==k);sv()}
function factRefresh(){const box=$('#factBox');if(!box)return;box.innerHTML=factHTML()}
function factHTML(){if(!DAILY_FACT)return'';return`💡 <b>هل تعلم؟</b> <span class=mu style="font-size:11px">(${FCAT[DAILY_FACT.cat]})</span><p style="margin:6px 0">${DAILY_FACT.txt}</p><p class=mu style="font-size:11px">المصدر: ${DAILY_FACT.src}</p><div class=bar style="margin-top:4px"><button onclick=factPrev() ${FIDX<=0?'disabled':''}>‹ السابقة</button><button onclick=factNext()>التالية ›</button><button onclick=factWeb()>🌐 من الإنترنت الآن</button></div>`}
function factNext(){if(FIDX<FHIST.length-1){FIDX++}else{const f=pickFact();if(!f)return;FHIST.push(f);FIDX++}DAILY_FACT=FHIST[FIDX];factRefresh()}
function factPrev(){if(FIDX<=0)return;FIDX--;DAILY_FACT=FHIST[FIDX];factRefresh()}
function factWeb(){const box=$('#factBox');if(box)box.style.opacity='.5';
fetch('https://ar.wikipedia.org/api/rest_v1/page/random/summary').then(r=>r.json()).then(j=>{
const f={id:'w'+Date.now(),cat:'aalam',txt:(j.extract||'').split('\n')[0].slice(0,220),src:'ويكيبيديا (مباشر الآن) — '+(j.title||'')};
if(!f.txt){if(box)box.style.opacity='1';return}
FHIST=FHIST.slice(0,FIDX+1);FHIST.push(f);FIDX++;DAILY_FACT=f;factRefresh()
}).catch(()=>{if(box){box.style.opacity='1';box.insertAdjacentHTML('beforeend','<p class=mu style="font-size:11px">⚠️ تعذّر الاتصال بالإنترنت الآن</p>')}})}
DAILY_FACT=pickFact();FHIST=[DAILY_FACT];FIDX=0;
mkStars();render();fetchSistani();

</script></body></html>
