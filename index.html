<style>
:root{--bg:#0C1A2A;--bg2:#0D2B36;--card:#14303F;--tx:#EAF6FA;--mu:#7F9DAE;--ac:#57B6CB}

[data-t=oled]{--bg:#000;--bg2:#050505;--card:#0D0D0D;--tx:#F2F2F2;--mu:#7A7A7A;--ac:#3EE6B4}
[data-t=gold]{--bg:#1C130A;--bg2:#2B1D0E;--card:#241708;--tx:#F3E6CE;--mu:#B79A6E;--ac:#D4AF37}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--tx);font:15px Tajawal,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px 30px;position:relative;overflow-x:hidden}
h1{font-size:32px}.mu{color:var(--mu)}p{margin:6px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid #8883;border-radius:12px;padding:9px 12px}
button{cursor:pointer;transition:transform .12s,opacity .12s;touch-action:manipulation}button:active,.mc:active,.d:active,.ev:active{transform:scale(.95);opacity:.8}.pri{background:var(--ac);color:#111;border:0;font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.mc{position:relative;perspective:900px;cursor:pointer;touch-action:manipulation;min-height:118px}
.mc .inner{position:relative;width:100%;height:100%;min-height:150px;transition:transform .3s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;will-change:transform}
.mc.flip .inner{transform:rotateY(180deg)}
.mc .face{position:absolute;inset:0;backface-visibility:hidden;text-align:right;padding:14px 16px;border-radius:26px;background:radial-gradient(circle at 85% 0%,color-mix(in srgb,var(--tn) 32%,transparent),transparent 62%),var(--card);border:1.5px solid #ffffff14;display:flex;flex-direction:column;justify-content:flex-end}
.mc .back{transform:rotateY(180deg);justify-content:center;align-items:center;text-align:center;gap:4px;background:var(--card)}
.mc.cur .face{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.tp{display:flex;justify-content:space-between;align-items:center;position:absolute;top:14px;left:16px;right:16px}
.nu{font:16px 'Noto Serif',Georgia,serif}.ic{width:26px;height:26px;fill:none;stroke:var(--tn);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mc b{font-size:26px;line-height:1.25;margin-top:38px}.iq{font-size:13px;color:var(--ac)}
.mc em,.se{font:italic 15px 'Noto Serif',Georgia,serif;color:var(--mu)}
.bd{align-self:flex-start;margin-top:6px;background:var(--ac);color:#06202a;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700}

.th{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:14px;padding:0;font-size:20px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:9.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d{min-height:64px;background:var(--card);border-radius:10px;padding:14px 2px 5px;text-align:center;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1.5px var(--hc);display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none}

.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.shoot{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 6px 2px #fff;animation:shoot 1.1s ease-out forwards}

.cresc{position:absolute;top:14%;right:10%;font-size:34px;animation:glow 1.6s ease-in-out forwards}

.burst{position:absolute;inset:0;border-radius:50%;animation:burst 1.3s ease-out forwards}

.globe.back{animation:gback .65s ease-out forwards}
.globe.fwd{animation:gfwd .65s ease-out forwards}

@keyframes gfwd{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(150deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9) rotate(320deg)}}
.rng{width:100%}
.wdname{font-size:20px;font-weight:700;color:var(--ac)}

#peek.show{display:block;animation:peekIn .26s cubic-bezier(.25,1.2,.3,1) forwards}
#peek.out{animation:peekOut .16s ease forwards}

.star,.globe,.shoot,.cresc,.burst{animation:none!important;display:none!important}
.mc .inner{transition:none!important}
.grid,.days,h1,h2,#sh>div,#peek.show,#peek.out{animation:none!important}
}
.star{will-change:opacity}
