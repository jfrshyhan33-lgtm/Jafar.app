const SEA=[0,0,1,1,1,2,2,2,3,3,3,0],TN=['#6C9BD2','#6FBF8E','#D9A857','#D08A5B'];
const ICO=['<path d="M12 2v20M4 7l16 10M20 7L4 17M9 4l3 2 3-2M9 20l3-2 3 2"/>','<path d="M12 21v-9M12 12C12 8 9 6 5 6c0 4 3 6 7 6zM12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/>','<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>','<path d="M12 3c5 3 7 8 4 13-1 2-3 4-4 5-1-1-3-3-4-5-3-5-1-10 4-13zM12 8v10"/>'];
function home(){const n=S.n[iso(T)],c=S.cd&&nxt(S.cd),h=hij(T),cy=V.y==T.getFullYear(),cm=T.getMonth();
$('#app').innerHTML=`<div style="position:relative;text-align:center;margin-top:14px"><button class=th onclick=set()>🎨</button><p style="letter-spacing:5px;color:var(--ac);font-size:14px">CALENDAR</p><h1>التقويم</h1><p class=se style="font-size:20px">The Twelve Months</p><div class=pill onclick="goto(T)">اليوم: ${gf(T)}<br><small>${hf(h)}</small></div></div>
${n&&n.r&&n.t?`<div class=ev style="border-color:var(--ac)" onclick="day('${iso(T)}')">🔔 ${n.t}</div>`:''}
${c?`<div class=ev style="border-color:var(--ac)" onclick="day('${iso(c.d)}')">⏳ ${c.e.ti}: بعد <b>${c.n}</b> يوم<br><small class=mu>${gf(c.d)}</small> <button onclick="event.stopPropagation();cdSet(null)">✕</button></div>`:''}
<div class=bar style="justify-content:center"><button class=pri onclick="goto(T)">اليوم</button><button onclick=srch()>🔍 بحث</button><button onclick=upc()>القادمة</button><button onclick="hmon(0)">الشهر الهجري</button><button onclick=jmp()>انتقال</button></div>
<div class=bar style="justify-content:center;align-items:center"><button onclick="V.y--;render()">›</button><b>${V.y}</b><button onclick="V.y++;render()">‹</button></div>
<div class=grid>${MA.map((a,i)=>{const k=SEA[i],cu=cy&&i==cm;return`<div class="mc${cu?' cur':''}" style="--tn:${TN[k]}" onclick="V.m=${i};render()"><div class=tp><span class=nu style="color:${TN[k]}">${String(i+1).padStart(2,0)}</span><svg class=ic viewBox="0 0 24 24">${ICO[k]}</svg></div><b>${a}</b><span class=iq>${MN[i]}</span><em>${ME[i]}</em>${cu?'<span class=bd>الشهر الحالي</span>':''}</div>`}).join('')}</div>
<p class=mu style="text-align:center;margin-top:26px;font-size:13px">اضغط على أي شهر لعرض أيامه وأحداثه التاريخية</p>`}
function mon(){const f=new Date(V.y,V.m,1),n=new Date(V.y,V.m+1,0).getDate(),o=(f.getDay()+1)%7;let c='<div></div>'.repeat(o);
for(let i=1;i<=n;i++){const d=new Date(V.y,V.m,i),h=hij(d),E=evs(d),k=iso(d);c+=`<div class="d ${k==iso(T)?'t':''}" onclick="day('${k}')">${i}<i>${h.d}</i><div class=dots>${E.slice(0,3).map(e=>`<b style="background:${col(e.t)}"></b>`).join('')}${S.n[k]&&S.n[k].t?'<b style="background:var(--tx)"></b>':''}</div></div>`}
const a=hij(f),z=hij(new Date(V.y,V.m,n));
$('#app').innerHTML=`<div class=bar><button onclick="V.m=null;render()">الرئيسية</button><button onclick="nm(-1)">‹</button><button onclick="nm(1)">›</button><button class=pri onclick="goto(T)">اليوم</button></div><h2>${MA[V.m]} · ${MN[V.m]} ${V.y}</h2><p class=se>${ME[V.m]}</p><p class=mu>${HN[a.m-1]} ${a.y} — ${HN[z.m-1]} ${z.y} هـ · اختر يوماً</p><div class=days>${WD.map(w=>`<div class=wd>${w.slice(0,3)}</div>`).join('')}${c}</div>`}
function nm(n){V.m+=n;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}render()}
function goto(d,o){V.y=d.getFullYear();V.m=d.getMonth();render();if(o)day(iso(d))}
function day(k){const d=new Date(k+'T00:00'),h=hij(d),E=evs(d),N=S.n[k]||{};
sheet(`<h3>${gf(d)}</h3><p style="color:var(--ac)">${hf(h)}</p>${E.map(card).join('')||'<p class=mu>لا توجد مناسبة في هذا اليوم</p>'}<h4>📝 ملاحظة / تذكير</h4><textarea id=nt style="width:100%" oninput="nSave('${k}')">${N.t||''}</textarea><label><input type=checkbox id=nr ${N.r?'checked':''} onchange="nSave('${k}')"> تذكير (يظهر في الرئيسية)</label><h4>📜 في مثل هذا اليوم (ويكيبيديا)</h4><div id=wk class=mu>...</div><p class=mu style="font-size:12px;margin-top:12px">التواريخ وفق المشهور عند الإمامية، وقد تختلف الروايات.</p>`);
fetch(`https://ar.wikipedia.org/api/rest_v1/feed/onthisday/events/${d.getMonth()+1}/${d.getDate()}`).then(r=>r.json()).then(j=>{$('#wk').innerHTML=j.events.slice(0,6).map(e=>`<p>• <b>${e.year}</b> ${e.text}</p>`).join('')}).catch(()=>{$('#wk').textContent='تعذّر التحميل'})}
function nSave(k){S.n[k]={t:$('#nt').value,r:$('#nr').checked};if(!S.n[k].t)delete S.n[k];sv()}
function cdSet(id){S.cd=id;sv();cl();render()}
function rm(id){if(confirm('حذف هذه المناسبة؟')){S.del.push(id);sv();cl();render()}}
function ef(id){const e=id?all().find(x=>x.id==id):{m:1,d:1,t:'h',ti:'',fg:'',su:'',yr:'',sr:'',df:''};
sheet(`<h3>${id?'تعديل':'إضافة'} مناسبة</h3><div class=f><input id=f1 placeholder="اسم المناسبة" value="${e.ti}"><select id=f2>${HN.map((n,i)=>`<option value=${i+1} ${e.m==i+1?'selected':''}>${n}</option>`).join('')}</select><input id=f3 type=number min=1 max=30 value="${e.d}"><select id=f4>${Object.keys(TY).map(k=>`<option value=${k} ${e.t==k?'selected':''}>${TY[k][0]}</option>`).join('')}</select><input id=f5 placeholder="الشخصية" value="${e.fg||''}"><textarea id=f6 placeholder="شرح مختصر">${e.su||''}</textarea><input id=f7 placeholder="السنة" value="${e.yr||''}"><input id=f8 placeholder="المصدر" value="${srT(e.sr||'')}"><input id=f9 placeholder="اختلاف الروايات" value="${e.df||''}"><button class=pri onclick="sf('${id||''}')">حفظ</button></div>`)}
function sf(id){const o={ti:$('#f1').value,m:+$('#f2').value,d:+$('#f3').value,t:$('#f4').value,fg:$('#f5').value,su:$('#f6').value,yr:$('#f7').value,sr:$('#f8').value,df:$('#f9').value};if(!o.ti)return;if(id)S.ed[id]=o;else S.x.push({id:'c'+Date.now(),...o});sv();cl();render()}
function srch(){sheet(`<input id=q style="width:100%" placeholder="اسم شخصية/حدث، أو تاريخ مثل 10/1 أو 25/9" oninput="sr(this.value)"><div id=rs></div>`)}
function sr(q){q=q.trim();let r=[];const m=q.match(/^(\d+)[\/\-](\d+)/);
if(m){const a=+m[1],b=+m[2];r=[...new Set([...all().filter(e=>e.gm?e.gd==a&&e.gm==b:e.d==a&&e.m==b),...evs(new Date(V.y,b-1,a))])]}else if(q)r=all().filter(e=>(e.ti+e.fg).includes(q));
$('#rs').innerHTML=r.map(e=>{const d=nmap()[e.id];return`<div class=ev style="border-color:${col(e.t)}" ${d?`onclick="day('${iso(d)}')"`:''}><b>${e.ti}</b><br><small class=mu>${e.gm?e.gd+'/'+e.gm+' ميلادي':e.d+' '+HN[e.m-1]}${d?' · القادمة: '+gf(d):''}</small></div>`}).join('')||'<p class=mu>لا نتائج</p>'}
function upc(){let r='',c=0;for(let i=0;i<400&&c<25;i++){const d=add(T,i);evs(d).forEach(e=>{c++;r+=`<div class=ev onclick="day('${iso(d)}')" style="border-color:${col(e.t)}"><b>${e.ti}</b><br><small class=mu>${gf(d)} · ${hf(hij(d))} · ${i?'بعد '+i+' يوم':'اليوم'}</small></div>`})}sheet('<h3>المناسبات القادمة</h3>'+r)}
let HB;
function hmon(x){HB=x==0?T:add(HB,x>0?30:-1);HB=add(HB,1-hij(HB).d);const m=hij(HB);let r='';
for(let i=0;i<30;i++){const d=add(HB,i),h=hij(d);if(h.m!=m.m)break;evs(d).forEach(e=>r+=`<div class=ev onclick="day('${iso(d)}')" style="border-color:${col(e.t)}"><small class=mu>${h.d} ${HN[m.m-1]} · ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}</small><br><b>${e.ti}</b></div>`)}
sheet(`<h3>${HN[m.m-1]} ${m.y} هـ</h3><div class=bar><button onclick="hmon(-1)">‹ السابق</button><button onclick="hmon(1)">التالي ›</button></div>${r||'<p class=mu>لا مناسبات</p>'}`)}
function jmp(){sheet(`<h3>الانتقال إلى يوم</h3><p>ميلادي</p><input type=date id=jd onchange="goto(new Date(this.value+'T00:00'),1);"><p>هجري</p><div class=bar><input id=jy type=number placeholder="السنة" style="width:90px"><select id=jm>${HN.map((n,i)=>`<option value=${i+1}>${n}</option>`).join('')}</select><input id=jdd type=number placeholder="اليوم" style="width:80px"><button class=pri onclick="jh()">اذهب</button></div>`)}
function jh(){const y=+$('#jy').value,m=+$('#jm').value,d=+$('#jdd').value,t=hij(T),g=add(T,Math.round((y-t.y)*354.367+(m-t.m)*29.53+(d-t.d)));for(let k=-6;k<=6;k++){const x=add(g,k),h=hij(x);if(h.y==y&&h.m==m&&h.d==d){cl();return goto(x,1)}}alert('تاريخ غير صالح')}
function set(){sheet(`<h3>الإعدادات</h3><p>الثيم</p><div class=bar>${[['','كحلي'],['green','أخضر'],['plum','بنفسجي'],['light','فاتح']].map(t=>`<button onclick="S.th='${t[0]}';sv();render()">${t[1]}</button>`).join('')}</div><p>ألوان المناسبات</p>${Object.keys(TY).map(k=>`<label>${TY[k][0]} <input type=color value="${col(k)}" onchange="S.c['${k}']=this.value;sv();render()"></label><br>`).join('')}<p>تعديل الهجري (حسب رؤية الهلال)</p><select onchange="S.off=+this.value;sv();render()">${[-1,0,1].map(o=>`<option value=${o} ${S.off==o?'selected':''}>${o>0?'+'+o:o} يوم</option>`).join('')}</select><div class=bar><button class=pri onclick="ef('')">＋ إضافة مناسبة</button></div>`)}
render();
</script></body></html>
